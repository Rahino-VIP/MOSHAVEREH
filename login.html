<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به اتاق فرمان | راهینو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* 🎨 پالت رنگی اختصاصی مدیریت راهینو */
        :root { 
            --bg-dark: #0a0f0d; 
            --surface: #121a18; 
            --border: #263633;
            
            --primary: #639889; 
            --primary-hover: #4d7a6e;
            --primary-glow: rgba(99, 152, 137, 0.25);
            
            --text-main: #f1f5f9; 
            --text-muted: #8b9d99;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }

        /* افکت‌های نوری پس‌زمینه */
        .glow { position: absolute; width: 450px; height: 450px; background: var(--primary-glow); filter: blur(120px); border-radius: 50%; z-index: 0; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* کارت شیشه‌ای لاگین */
        .login-card { background: rgba(18, 26, 24, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); width: 100%; max-width: 420px; padding: 45px 40px; border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); z-index: 1; position: relative; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .brand { text-align: center; font-size: 26px; font-weight: 900; margin-bottom: 5px; letter-spacing: 1px; }
        .brand span { color: var(--primary); }
        .subtitle { text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 35px; letter-spacing: 2px; text-transform: uppercase; font-family: monospace;}

        .input-group { margin-bottom: 22px; }
        .input-label { display: block; font-size: 13px; font-weight: bold; color: var(--text-muted); margin-bottom: 8px; }
        .modern-input { width: 100%; padding: 16px 20px; border-radius: 14px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 15px; outline: none; transition: 0.3s; text-align: left; direction: ltr; }
        .modern-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); background: rgba(0,0,0,0.4); }

        .btn-login { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; box-shadow: 0 10px 25px var(--primary-glow); }
        .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 35px var(--primary-glow); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

        .error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 20px; display: none; font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 10px; border: 1px dashed rgba(239, 68, 68, 0.3); animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .loader { display: none; margin: 0 auto; border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid white; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="login-card">
        <div class="brand">قطب‌نمای <span>راهینو</span></div>
        <div class="subtitle">Secure Admin Cockpit</div>

        <div class="input-group">
            <label class="input-label">ایمیل سازمانی (Email)</label>
            <input type="email" id="email" class="modern-input" placeholder="admin@rahino.com" autocomplete="off">
        </div>

        <div class="input-group">
            <label class="input-label">رمز عبور (Password)</label>
            <input type="password" id="password" class="modern-input" placeholder="••••••••" autocomplete="off">
        </div>

        <button class="btn-login" id="loginBtn" onclick="handleLogin()">
            <span id="btnText">ورود به سیستم مرکزی</span>
            <div class="loader" id="btnLoader"></div>
        </button>

        <div class="error-msg" id="errorBox">دسترسی غیرمجاز! ایمیل یا رمز عبور اشتباه است.</div>
    </div>

    <script>
        // ==========================================
        // 🔗 تنظیمات اتصال سوپابیس
        // ==========================================
        // ==========================================
        // 🔗 تنظیمات اتصال سوپابیس (فقط برای لاگین)
        // ==========================================
        const SUPABASE_URL = 'https://etlutqwwqeahevsskjih.supabase.co'; 
        
        // 👈 اینجا حتماً باید کلید anon (عمومی) باشد تا سیستم لاگین کار کند
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0bHV0cXd3cWVhaGV2c3NramloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTYwNjIsImV4cCI6MjA5NzE5MjA2Mn0.kXvSQtGM7w28IffQ4JOtv_xtHenyDV0tC70bOd7N7nQ'; 
               
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // بررسی اینکه آیا ادمین قبلاً لاگین کرده یا نه
        window.onload = async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.replace('dashboard.html');
            }
        };

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('btnLoader');
            const errorBox = document.getElementById('errorBox');

            if (!email || !password) {
                errorBox.innerText = "لطفاً ایمیل و رمز عبور را وارد کنید.";
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';
            errorBox.style.display = 'none';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // لاگین موفقیت‌آمیز
                window.location.replace('dashboard.html');

            } catch (error) {
                console.error(error);
                btn.disabled = false;
                btnText.style.display = 'block';
                loader.style.display = 'none';
                
                errorBox.innerText = "دسترسی غیرمجاز! ایمیل یا رمز عبور اشتباه است.";
                errorBox.style.display = 'block';
            }
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
