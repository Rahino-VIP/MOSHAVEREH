<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کنترل و گزارش تردد پانسیون | راهینو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --primary: #77bba9; 
            --primary-hover: #8fd0bf; 
            --primary-fade: rgba(119, 187, 169, 0.1);
            --accent: #e59ea3; 
            --bg-color: #121918; 
            --surface: #1b2624; 
            --surface-light: #253330;
            --border-color: #2d3d3a;
            --text-main: #f1f5f9; 
            --text-muted: #94a3b8;
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* لاگین استایل */
        .form-input { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 15px; border-radius: 12px; outline: none; text-align: right; font-family: 'Vazirmatn'; font-weight: bold; transition: 0.3s; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-fade); }
        .login-overlay { position: fixed; inset: 0; background: var(--bg-color); z-index: 9000; display: none; justify-content: center; align-items: center; padding: 20px;}
        .login-box { background: var(--surface); padding: 40px 20px; border-radius: 24px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border-color); }

        .top-navbar { background: var(--surface); border-bottom: 1px solid var(--border-color); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 10; box-shadow: var(--shadow); }
        .nav-brand { font-size: 20px; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .nav-brand span { color: var(--primary); }
        
        .time-box { display: flex; flex-direction: column; align-items: flex-end; }
        .live-clock { font-family: monospace; font-size: 24px; font-weight: bold; color: var(--accent); letter-spacing: 2px; direction: ltr; line-height: 1; }
        .live-date { font-size: 13px; color: var(--text-muted); font-weight: bold; margin-top: 5px; }

        .main-content { flex: 1; padding: 30px 40px; overflow-y: auto; }
        
        /* مدیریت نمایش بخش‌ها */
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .toolbar { display: flex; gap: 15px; margin-bottom: 25px; }
        .search-bar { flex: 1; background: var(--surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 18px 25px; border-radius: 16px; font-size: 15px; font-weight: bold; outline: none; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-fade); }

        .btn-report { background: var(--surface); color: var(--primary); border: 1px solid var(--primary); padding: 0 25px; border-radius: 16px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-report:hover { background: var(--primary); color: var(--bg-color); }

        .stats-row { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: var(--surface); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        .stat-title { font-size: 13px; color: var(--text-muted); font-weight: bold; }
        .stat-value { font-size: 28px; font-weight: 900; color: var(--primary); }

        .list-container { background: var(--surface); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
        .list-row { display: flex; align-items: center; padding: 20px 25px; border-bottom: 1px solid var(--border-color); transition: 0.2s; }
        .list-row:last-child { border-bottom: none; }
        .list-row:hover { background: var(--surface-light); }

        .col-info { flex: 2; display: flex; flex-direction: column; gap: 5px; }
        .student-name { font-size: 16px; font-weight: 900; color: var(--text-main); }
        .student-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; align-items: center; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .badge-plan { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

        .col-status { flex: 1.5; font-size: 13px; font-family: monospace; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; }
        .time-row { display: flex; gap: 5px; }
        .time-tag { display: inline-block; padding: 4px 8px; border-radius: 6px; background: var(--bg-color); border: 1px solid var(--border-color); font-weight: bold; font-size: 11px; }

        .col-actions { flex: 1.5; display: flex; gap: 10px; justify-content: flex-end; }
        .btn-action { padding: 12px 25px; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-entry { background: var(--success); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2); }
        .btn-entry:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }
        .btn-exit { background: var(--danger); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.2); }
        .btn-exit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); }
        .btn-action:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; filter: grayscale(1); }

        /* استایل‌های مربوط به بخش گزارش */
        .page-title { font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 30px; text-align: center; }
        .day-card { background: var(--surface); border: 1px solid var(--border-color); border-radius: 16px; margin-bottom: 15px; box-shadow: var(--shadow); overflow: hidden; transition: 0.3s; }
        .day-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; background: rgba(0,0,0,0.1); }
        .day-header:hover { background: var(--primary-fade); }
        .date-title { font-size: 16px; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .date-title .icon { background: var(--primary); color: #000; padding: 5px 10px; border-radius: 10px; font-size: 14px; }
        .day-stats { font-size: 13px; color: var(--text-muted); font-weight: bold; display: flex; gap: 15px; }
        .day-body { display: none; padding: 0; border-top: 1px solid var(--border-color); }
        .day-card.active .day-body { display: block; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 500px; }
        th, td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: bold; }
        td { color: var(--text-main); font-weight: bold; }
        tr:last-child td { border-bottom: none; }

        .loader-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; transition: 0.3s opacity; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 992px) {
            .top-navbar { flex-direction: row; padding: 15px 20px; }
            .nav-brand { font-size: 13px; }
            .live-clock { font-size: 18px; }
            .live-date { font-size: 10px; }
            .main-content { padding: 15px; }
            .toolbar { flex-direction: column; margin-bottom: 15px; gap: 10px; }
            .btn-report { padding: 12px; justify-content: center; }
            .stats-row { flex-direction: row; gap: 8px; margin-bottom: 15px; }
            .stat-box { flex: 1; padding: 10px 5px; flex-direction: column; justify-content: center; gap: 5px; border-radius: 12px; text-align: center; }
            .stat-title { font-size: 10px; }
            .stat-value { font-size: 20px; }
            .list-row { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 15px; gap: 5px; }
            .col-info { flex: 1; border-bottom: none; padding-bottom: 0; }
            .col-actions { flex: 0 0 auto; flex-direction: row; gap: 6px; }
            .col-status { flex: 1 1 100%; flex-direction: row; margin-top: 5px; }
            .student-name { font-size: 14px; margin-bottom: 3px; }
            .student-meta { gap: 5px; }
            .btn-action { padding: 8px 14px; font-size: 18px; border-radius: 10px; }
            .hide-mobile { display: none !important; }
            .day-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="loader-overlay" id="mainLoader">
        <div class="spinner"></div>
        <h3 id="loaderText" style="color: var(--primary);">لطفا چند لحظه صبر کنید...</h3>
    </div>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h1 style="color: var(--primary); margin-bottom: 10px; font-weight: 900;">مدیریت تردد راهینو</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 13px;">فقط پرسنل مجاز حق ورود دارند</p>
            <input type="tel" id="adminPhone" class="form-input" placeholder="شماره موبایل" style="margin-bottom: 15px; width:100%; text-align: center; font-size: 18px; letter-spacing: 2px;" autocomplete="off">
            <input type="password" id="adminPass" class="form-input" placeholder="رمز عبور" style="margin-bottom: 15px; width:100%; text-align: center; font-size: 18px; letter-spacing: 2px;">
            <button class="btn-action" style="width: 100%; background: var(--primary); color: #000;" onclick="adminLogin()">ورود به پنل</button>
        </div>
    </div>

    <div class="top-navbar">
        <div class="nav-brand">🪪 قطب‌نمای <span>راهینو</span> | پنل تردد</div>
        <div style="display:flex; align-items:center; gap: 20px;">
            <div class="time-box hide-mobile">
                <div class="live-clock" id="liveClock">00:00:00</div>
                <div class="live-date" id="liveDate"></div>
            </div>
            <button onclick="adminLogout()" class="btn-action btn-exit" style="padding: 8px 15px; font-size: 12px; height: fit-content; display: none;" id="btnLogout">خروج 🚪</button>
        </div>
    </div>

    <div class="main-content">
        
        <!-- =======================
             بخش مانیتورینگ زنده
             ======================= -->
        <div id="view-live" class="view-section active">
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-title">کل اعضای پانسیون</div>
                    <div class="stat-value" id="statTotal">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">حاضرین در سالن</div>
                    <div class="stat-value" style="color: var(--success);" id="statPresent">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">ثبت تردد امروز</div>
                    <div class="stat-value" style="color: var(--accent);" id="statActive">0</div>
                </div>
            </div>

            <div class="toolbar" style="align-items: center;">
                <input type="text" id="searchInput" class="search-bar" placeholder="🔍 جستجوی نام یا موبایل دانش‌آموز..." onkeyup="filterList()">
                <button class="btn-report" onclick="switchView('view-report')">🗂️ گزارشات و بایگانی</button>
            </div>

            <div class="list-container" id="studentsList"></div>
        </div>

        <!-- =======================
             بخش گزارشات و بایگانی
             ======================= -->
        <div id="view-report" class="view-section">
            <div class="toolbar" style="justify-content: flex-end;">
                <button class="btn-report" onclick="switchView('view-live')">🔙 بازگشت به پنل زنده</button>
            </div>
            <h1 class="page-title">گزارش روزانه پانسیون</h1>
            <div id="reportContainer"></div>
        </div>

    </div>

    <script>
        // 🔒 استفاده از کلید معمولی (Anon Key) به جای Service Key برای امنیت بیشتر
        const SUPABASE_URL = 'https://etlutqwwqeahevsskjih.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0bHV0cXd3cWVhaGV2c3NramloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTYwNjIsImV4cCI6MjA5NzE5MjA2Mn0.kXvSQtGM7w28IffQ4JOtv_xtHenyDV0tC70bOd7N7nQ'; 
        
        // به دلیل نیاز به لاگین ماندن ادمین، persistSession روی تنظیمات پیش‌فرض باقی می‌ماند
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allData = [];

        // نمایش زنده ساعت و تاریخ
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US', { hour12: false, timeZone: 'Asia/Tehran' });
        }, 1000);

        const f = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Tehran' });
        document.getElementById('liveDate').innerText = f.format(new Date());

        function showLoader(text = "لطفا چند لحظه صبر کنید...") {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('mainLoader').style.display = 'flex';
            document.getElementById('mainLoader').style.opacity = '1';
        }

        function hideLoader() {
            document.getElementById('mainLoader').style.opacity = '0';
            setTimeout(() => document.getElementById('mainLoader').style.display = 'none', 300);
        }

        function toEnglishDigits(str) { 
            return str ? str.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)) : ''; 
        }

        // =======================
        // 🔐 سیستم لاگین ادمین
        // =======================
        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if(session) {
                verifyAdminRole(session.user.email.split('@')[0]);
            } else {
                hideLoader();
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        };

        async function adminLogin() {
            let phone = toEnglishDigits(document.getElementById('adminPhone').value.trim());
            let pass = document.getElementById('adminPass').value.trim();
            if(!phone || !pass) return alert('شماره و رمز عبور را وارد کنید.');

            showLoader("در حال ورود به سیستم...");
            const { error } = await supabaseClient.auth.signInWithPassword({ email: phone + '@rahino.ir', password: pass });
            if(error) {
                hideLoader();
                return alert('اطلاعات ورود اشتباه است.');
            }
            verifyAdminRole(phone);
        }

        async function verifyAdminRole(phone) {
            const { data, error } = await supabaseClient.from('users').select('role').eq('phone_number', phone).single();
            if(error || !data || data.role !== 'admin') {
                await supabaseClient.auth.signOut();
                hideLoader();
                alert('❌ دسترسی غیرمجاز! شما مجوز مدیریت پنل را ندارید.');
                document.getElementById('loginOverlay').style.display = 'flex';
            } else {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'inline-flex';
                // بعد از ورود موفق مستقیما بخش زنده را بارگیری می‌کنیم
                fetchAttendanceData();
            }
        }

        async function adminLogout() {
            if(confirm('آیا از پنل خارج می‌شوید؟')) {
                await supabaseClient.auth.signOut();
                window.location.reload(); 
            }
        }

        // =======================
        // جابجایی بین پنل‌ها
        // =======================
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            if (viewId === 'view-live') {
                fetchAttendanceData();
            } else if (viewId === 'view-report') {
                fetchReports();
            }
        }

        function getTodayShamsi() {
            const parts = new Intl.DateTimeFormat('fa-IR-u-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Tehran' }).formatToParts(new Date());
            let y, m, d;
            for (let p of parts) { if (p.type === 'year') y = p.value; if (p.type === 'month') m = p.value; if (p.type === 'day') d = p.value; }
            return `${y}-${m}-${d}`; 
        }

        // =======================
        // بخش مانیتورینگ زنده
        // =======================
        async function fetchAttendanceData() {
            showLoader("در حال دریافت لیست ترددها...");
            try {
                let todayShamsi = getTodayShamsi();
                let todayMiladi = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Tehran' });

                const { data: monthlySubs, error: subErr } = await supabaseClient
                    .from('pan_monthly_subs')
                    .select('phone_number, plan_type, end_date')
                    .eq('status', 'active')
                    .gte('end_date', todayShamsi);
                if (subErr) throw subErr;

                const { data: allDailyRes, error: dailyErr } = await supabaseClient
                    .from('pan_reservations')
                    .select('phone_number, reserved_dates');
                if (dailyErr) throw dailyErr;

                const dailyReservations = allDailyRes.filter(res => {
                    if (!res.reserved_dates) return false;
                    if (typeof res.reserved_dates === 'string') return res.reserved_dates.includes(todayShamsi);
                    else if (Array.isArray(res.reserved_dates)) return res.reserved_dates.includes(todayShamsi);
                    return false;
                });

                let activePhones = new Set();
                monthlySubs?.forEach(sub => activePhones.add(sub.phone_number));
                dailyReservations?.forEach(res => activePhones.add(res.phone_number));
                let phonesArray = Array.from(activePhones);

                if (phonesArray.length === 0) {
                    renderList([]);
                    hideLoader();
                    return;
                }

                const { data: usersInfo, error: usersErr } = await supabaseClient
                    .from('users')
                    .select('phone_number, full_name')
                    .in('phone_number', phonesArray);
                if (usersErr) throw usersErr;

                const { data: logs, error: logErr } = await supabaseClient
                    .from('attendance_logs')
                    .select('*')
                    .eq('log_date', todayMiladi)
                    .order('entry_time', { ascending: true });
                if (logErr) throw logErr;

                allData = phonesArray.map(phone => {
                    let user = usersInfo.find(u => u.phone_number === phone) || {};
                    let monthlyData = monthlySubs.find(m => m.phone_number === phone);
                    let dailyData = dailyReservations.find(d => d.phone_number === phone);
                    let studentLogs = logs.filter(l => l.student_nid === phone);
                    
                    let plan = '';
                    let planLabel = '';
                    let remainDaysText = '';

                    if (monthlyData) {
                        plan = monthlyData.plan_type;
                        planLabel = 'ماهانه';
                        remainDaysText = `انقضا: ${monthlyData.end_date.replace(/-/g, '/')}`;
                    } else if (dailyData) {
                        plan = 'daily';
                        planLabel = 'روزانه';
                        remainDaysText = 'فقط امروز';
                    }

                    return {
                        nid: phone,
                        name: user.full_name || 'کاربر راهینو',
                        planType: plan,
                        planLabel: planLabel,
                        remainingHtml: remainDaysText,
                        logs: studentLogs
                    };
                });

                allData.sort((a, b) => {
                    let aIsPresent = a.logs.some(l => l.entry_time && !l.exit_time);
                    let bIsPresent = b.logs.some(l => l.entry_time && !l.exit_time);
                    let aHasLogs = a.logs.length > 0;
                    let bHasLogs = b.logs.length > 0;

                    let statusA = aIsPresent ? 1 : (aHasLogs ? 2 : 3);
                    let statusB = bIsPresent ? 1 : (bHasLogs ? 2 : 3);
                    return statusA - statusB;
                });

                renderList(allData);
                hideLoader();
            } catch (err) {
                console.error(err);
                alert("خطا در دریافت اطلاعات. لطفا اتصال اینترنت را بررسی کنید.");
                hideLoader();
            }
        }

        function renderList(list) {
            const container = document.getElementById('studentsList');
            container.innerHTML = '';
            
            let total = list.length;
            let present = 0;
            let activeToday = 0;

            if (list.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted); font-size:15px; font-weight:bold;">امروز هیچ فردی (ماهانه یا روزانه) برای حضور در پانسیون یافت نشد.</div>';
                document.getElementById('statTotal').innerText = '0';
                document.getElementById('statPresent').innerText = '0';
                document.getElementById('statActive').innerText = '0';
                return;
            }

            list.forEach(st => {
                let isPresent = st.logs.some(l => l.entry_time && !l.exit_time);
                let hasLogs = st.logs.length > 0;
                
                if (isPresent) present++;
                if (hasLogs) activeToday++;

                let badgeClass = st.planLabel === 'روزانه' ? 'badge-warning' : 'badge-plan';
                
                let timeInfo = '';
                if (hasLogs) {
                    timeInfo = st.logs.map(l => {
                        let inTime = l.entry_time ? new Date(l.entry_time).toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', timeZone:'Asia/Tehran'}) : '';
                        let outTime = l.exit_time ? new Date(l.exit_time).toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', timeZone:'Asia/Tehran'}) : '';
                        
                        if (inTime && !outTime) {
                            return `<div class="time-row"><span class="time-tag" style="color:var(--success);">📥 ${inTime}</span></div>`;
                        } else {
                            return `<div class="time-row"><span class="time-tag" style="color:var(--success);">📥 ${inTime}</span> <span class="time-tag" style="color:var(--danger);">📤 ${outTime}</span></div>`;
                        }
                    }).join('');
                } else {
                    timeInfo = `<span class="time-tag" style="opacity:0.6;">غایب (ورودی ثبت نشده)</span>`;
                }

                let btnEntryState = isPresent ? 'disabled' : '';
                let btnExitState = isPresent ? '' : 'disabled';

                container.innerHTML += `
                    <div class="list-row">
                        <div class="col-info">
                            <div class="student-name">${st.name}</div>
                            <div class="student-meta">
                                <span class="hide-mobile">📱 ${st.nid}</span>
                                <span class="badge ${badgeClass}">${st.planLabel}</span>
                                <span style="color: var(--text-muted); font-size:11px;">${st.remainingHtml}</span>
                            </div>
                        </div>
                        <div class="col-actions">
                            <button class="btn-action btn-entry" ${btnEntryState} onclick="actionEntry('${st.nid}', this)">📥 <span class="hide-mobile">ثبت ورود</span></button>
                            <button class="btn-action btn-exit" ${btnExitState} onclick="actionExit('${st.nid}', this)">📤 <span class="hide-mobile">ثبت خروج</span></button>
                        </div>
                        <div class="col-status">${timeInfo}</div>
                    </div>
                `;
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statPresent').innerText = present;
            document.getElementById('statActive').innerText = activeToday;
        }

        function filterList() {
            let term = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!term) { renderList(allData); return; }
            let filtered = allData.filter(st => st.name.toLowerCase().includes(term) || st.nid.includes(term));
            renderList(filtered);
        }

        async function actionEntry(nid, btn) {
            btn.innerHTML = '⏳...'; btn.disabled = true;
            try {
                const { data, error } = await supabaseClient.rpc('register_entry', { p_nid: nid });
                if (error) throw error;
                if (data && typeof data === 'string' && data.includes('⚠️')) {
                    alert(data); 
                }
                await fetchAttendanceData(); 
            } catch (err) {
                alert("خطا در ثبت ورود.");
                btn.innerHTML = '📥 <span class="hide-mobile">ثبت ورود</span>'; btn.disabled = false;
            }
        }

        async function actionExit(nid, btn) {
            btn.innerHTML = '⏳...'; btn.disabled = true;
            try {
                const { data, error } = await supabaseClient.rpc('register_exit', { p_nid: nid });
                if (error) throw error;
                await fetchAttendanceData(); 
            } catch (err) {
                alert("خطا در ثبت خروج.");
                btn.innerHTML = '📤 <span class="hide-mobile">ثبت خروج</span>'; btn.disabled = false;
            }
        }

        // =======================
        // بخش گزارشات بایگانی شده
        // =======================
        async function fetchReports() {
            showLoader("در حال استخراج بایگانی تردد...");
            try {
                const { data: logs, error: logErr } = await supabaseClient
                    .from('attendance_logs')
                    .select('student_nid, log_date, entry_time, exit_time')
                    .order('log_date', { ascending: false })
                    .order('entry_time', { ascending: true })
                    .limit(2000);
                if (logErr) throw logErr;

                let uniquePhones = [...new Set(logs.map(log => log.student_nid))];
                let usersInfo = [];
                if (uniquePhones.length > 0) {
                    const { data: users, error: usersErr } = await supabaseClient
                        .from('users')
                        .select('phone_number, full_name')
                        .in('phone_number', uniquePhones);
                    if (usersErr) throw usersErr;
                    usersInfo = users || [];
                }

                const groupedData = {};
                logs.forEach(log => {
                    const date = log.log_date;
                    if (!groupedData[date]) groupedData[date] = {};
                    const phone = log.student_nid;
                    if (!groupedData[date][phone]) {
                        let user = usersInfo.find(u => u.phone_number === phone);
                        groupedData[date][phone] = {
                            name: user && user.full_name ? user.full_name : 'ناشناس',
                            nid: phone,
                            records: []
                        };
                    }
                    groupedData[date][phone].records.push({ entry: log.entry_time, exit: log.exit_time });
                });

                renderReports(groupedData);
                hideLoader();
            } catch (err) {
                console.error(err);
                alert("خطا در استخراج بایگانی");
                hideLoader();
            }
        }

        function renderReports(groupedData) {
            const container = document.getElementById('reportContainer');
            let html = '';

            const dateKeys = Object.keys(groupedData).sort((a,b) => new Date(b) - new Date(a));

            if (dateKeys.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding: 50px;">هیچ دیتایی در بایگانی یافت نشد.</div>';
                return;
            }

            dateKeys.forEach((dateStr, index) => {
                const dateObj = new Date(dateStr);
                const shamsi = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Tehran' }).format(dateObj);
                
                const studentsDict = groupedData[dateStr];
                const studentKeys = Object.keys(studentsDict);
                const totalStudents = studentKeys.length;
                let totalEntries = 0;

                let tableRows = '';
                studentKeys.forEach(nid => {
                    const st = studentsDict[nid];
                    let timesHtml = st.records.map(rec => {
                        totalEntries++;
                        let inTime = rec.entry ? new Date(rec.entry).toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', timeZone:'Asia/Tehran'}) : '-';
                        let outTime = rec.exit ? new Date(rec.exit).toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', timeZone:'Asia/Tehran'}) : '-';
                        return `<div class="time-tag"><span class="text-success">📥 ${inTime}</span> | <span class="text-danger">📤 ${outTime}</span></div>`;
                    }).join('');

                    tableRows += `
                        <tr>
                            <td>${st.name}</td>
                            <td style="font-family:monospace; color:var(--text-muted); direction:ltr; text-align:right;">${st.nid}</td>
                            <td>${timesHtml}</td>
                        </tr>
                    `;
                });

                html += `
                    <div class="day-card" id="card_${index}">
                        <div class="day-header" onclick="document.getElementById('card_${index}').classList.toggle('active')">
                            <div class="date-title"><span class="icon">📅</span> ${shamsi}</div>
                            <div class="day-stats">
                                <span>👥 افراد حاضر: ${totalStudents} نفر</span>
                                <span>🔄 کل ترددها: ${totalEntries} بار</span>
                            </div>
                        </div>
                        <div class="day-body">
                            <div style="overflow-x: auto;">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>نام دانش‌آموز</th>
                                            <th>شماره موبایل</th>
                                            <th>ساعات ورود و خروج</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${tableRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
