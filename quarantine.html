<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قرنطینه برنامه‌ها | داشبورد راهینو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* 🎨 پالت رنگی اختصاصی مدیریت راهینو (تاریک و لوکس) */
        :root { 
            --bg-dark: #0a0f0d; 
            --surface-dark: #121a18; 
            --surface-light: #1b2624; 
            --border-color: #263633;
            
            --primary: #639889; 
            --primary-hover: #4d7a6e;
            --primary-glow: rgba(99, 152, 137, 0.15);
            
            --accent: #d9858a; 
            
            --success: #10b981; 
            --warning: #f59e0b; 
            --danger: #ef4444;
            
            --text-main: #f1f5f9; 
            --text-muted: #8b9d99;
        }

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* 👑 سایدبار (دقیقاً مشابه داشبورد مرکزی) */
        .sidebar { width: 280px; background: var(--surface-dark); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 25px 0; z-index: 100; flex-shrink: 0; box-shadow: -5px 0 25px rgba(0,0,0,0.2); }
        .brand { text-align: center; font-size: 22px; font-weight: 900; color: var(--text-main); margin-bottom: 40px; letter-spacing: 1px; }
        .brand span { color: var(--primary); }
        
        .nav-item { padding: 16px 30px; cursor: pointer; color: var(--text-muted); font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: 0.3s; border-right: 4px solid transparent; text-decoration: none; }
        .nav-item:hover { background: rgba(99, 152, 137, 0.05); color: var(--text-main); }
        .nav-item.active { background: linear-gradient(90deg, var(--primary-glow) 0%, transparent 100%); color: var(--primary); border-right-color: var(--primary); }
        
        .logout-btn { margin-top: auto; color: var(--accent); border-top: 1px solid var(--border-color); padding-top: 20px; }
        .logout-btn:hover { background: rgba(217, 133, 138, 0.08); color: var(--accent); }
        
        /* 🖥️ محتوای اصلی */
        .main-content { flex: 1; padding: 40px 50px; overflow-y: auto; position: relative; background: radial-gradient(circle at top left, #121a18 0%, #0a0f0d 100%); }
        .page-header { margin-bottom: 35px; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 12px; color: var(--text-main); }
        
        .header-stats { display: flex; gap: 15px; }
        .h-stat { background: var(--surface-dark); border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .h-stat span { color: var(--warning); font-size: 18px; }

        /* ⏳ کارت‌های قرنطینه */
        .quarantine-grid { display: flex; flex-direction: column; gap: 18px; margin-top: 25px; }
        
        .q-card { background: var(--surface-dark); border: 1px solid var(--border-color); border-radius: 16px; padding: 22px; position: relative; overflow: hidden; display: flex; gap: 20px; align-items: stretch; transition: 0.3s; border-right: 4px solid var(--warning); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .q-card:hover { transform: translateX(-5px); border-color: #384d49; box-shadow: 5px 12px 25px rgba(0,0,0,0.25); }
        
        .q-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid var(--border-color); padding-left: 20px; }
        .s-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .s-name { font-size: 18px; font-weight: bold; color: var(--text-main); margin-bottom: 8px; }
        .s-tags { display: flex; gap: 8px; }
        .s-tag { font-size: 11px; padding: 5px 10px; border-radius: 8px; background: var(--surface-light); color: var(--text-muted); border: 1px solid var(--border-color); }
        
        .s-note { background: rgba(245, 158, 11, 0.05); border: 1px dashed rgba(245, 158, 11, 0.2); padding: 12px 15px; border-radius: 12px; font-size: 13px; color: var(--text-main); line-height: 1.6; }
        .s-note span { color: var(--warning); font-weight: bold; display: block; margin-bottom: 5px; font-size: 12px; }

        .q-ai-status { width: 260px; padding: 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 12px; border-left: 1px solid var(--border-color); }
        .ai-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .ai-metric { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; background: var(--surface-light); padding: 8px 12px; border-radius: 8px; }
        .ai-metric.good { color: var(--primary); border: 1px solid var(--primary-glow); }
        
        .q-actions { width: 220px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
        .btn { padding: 14px; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; text-align: center; text-decoration: none; display: block; width: 100%; font-family: 'Vazirmatn'; }
        
        .btn-surgery { background: rgba(217, 133, 138, 0.1); color: var(--accent); border: 1px solid rgba(217, 133, 138, 0.3); }
        .btn-surgery:hover { background: var(--accent); color: white; box-shadow: 0 5px 15px rgba(217, 133, 138, 0.2); }
        
        .btn-quick { background: transparent; color: var(--success); border: 1px dashed var(--success); }
        .btn-quick:hover { background: var(--success); color: white; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2); }

        /* لودر امنیتی */
        .loader-overlay { position: fixed; inset: 0; background: rgba(10, 15, 13, 0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; transition: 0.3s; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader-overlay" id="authLoader">
        <div class="spinner"></div>
        <h3 style="color: var(--primary); font-size: 16px;">در حال اعتبارسنجی دسترسی فرمانده...</h3>
    </div>

    <!-- 👑 سایدبار یکپارچه مدیریت -->
    <div class="sidebar">
        <div class="brand">قطب‌نمای <span>راهینو</span></div>
        <a href="dashboard.html" class="nav-item"><span>🌅</span> داشبورد مرکزی</a>
        <a href="students.html" class="nav-item"><span>👥</span> پرونده دانش‌آموزان (CRM)</a>
        <a href="admin-finance.html" class="nav-item"><span>💳</span> مدیریت مالی و پذیرش</a>
        <a href="quarantine.html" class="nav-item active"><span>🧠</span> آزمایشگاه برنامه‌ریزی</a>
        <a href="control.html" class="nav-item"><span>⏳</span> کنترل برنامه‌ریزی</a>
        <a href="exam-surgery.html" class="nav-item"><span>🔬</span> جراحی کارنامه</a>
        <a href="settings.html" class="nav-item"><span>⚙️</span> تنظیمات و ترمینال هسته</a>
        <a href="#" class="nav-item logout-btn" onclick="handleLogout()"><span>🚪</span> خروج از سیستم</a>
    </div>

    <div class="main-content">
        
        <div class="page-header">
            <h1 class="page-title">
                ⏳ قرنطینه برنامه‌ها
                <span style="font-size: 13px; font-weight: normal; color: var(--text-main); background: var(--primary-glow); border: 1px solid var(--primary); padding: 5px 12px; border-radius: 8px;">منتظر تأیید نهایی شما</span>
            </h1>
            
            <div class="header-stats">
                <div class="h-stat"><span id="pendingCount">۰</span> پرونده در صف بررسی</div>
            </div>
        </div>

        <div class="quarantine-grid" id="quarantineGrid">
            <!-- کارت‌های قرنطینه اینجا تزریق می‌شوند -->
        </div>

    </div>

    <script>
        // ==========================================
        // 🔗 تنظیمات اتصال سوپابیس با هدر اجباری مدیریت
        // ==========================================
        const SUPABASE_URL = 'https://etlutqwwqeahevsskjih.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0bHV0cXd3cWVhaGV2c3NramloIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MTYxNjA2MiwiZXhwIjoyMDk3MTkyMDYyfQ.0tYN4CRA_D8jwColQ-qwcLqPXQUxwRlqC_9EcgcbZDI'; 
        
        // 👈 کلید حل مشکل: دور زدن RLS با تزریق مستقیم Authorization Header
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            global: {
                headers: {
                    Authorization: `Bearer ${SUPABASE_KEY}`
                }
            }
        });

        // ==========================================
        // 🚪 تابع خروج از سیستم
        // =========================================
        async function handleLogout() {
            if(confirm('آیا مطمئن هستید که می‌خواهید از اتاق فرمان خارج شوید؟')) {
                await supabaseClient.auth.signOut();
                window.location.replace('login.html');
            }
        }

        window.onload = async function() {
            try {
                // ۱. چک کردن دسترسی ادمین
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error || !session) {
                    window.location.replace('login.html');
                    return;
                }

                // اگر سشن معتبر بود، لودر رو با افکت محو کن
                document.getElementById('authLoader').style.opacity = '0';
                setTimeout(() => document.getElementById('authLoader').style.display = 'none', 300);

                // ۲. شروع فرایند خواندن اطلاعات از دیتابیس
                await loadQuarantineSchedules();

            } catch (err) {
                console.error("Auth Error:", err);
                alert("خطا در تایید هویت. لطفاً دوباره وارد شوید.");
                window.location.replace('login.html');
            }
        };

        // ==========================================
        // 📥 بارگذاری برنامه‌های در انتظار (قرنطینه)
        // ==========================================
        async function loadQuarantineSchedules() {
            const container = document.getElementById('quarantineGrid');
            const pendingCountSpan = document.getElementById('pendingCount');
            
            container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">در حال اسکن پایگاه داده و دریافت برنامه‌ها... ⏳</div>';

            try {
                // این درخواست حالا به دلیل وجود global.headers بدون مشکل از RLS عبور می‌کند
                const { data, error } = await supabaseClient
                    .from('ai_schedules')
                    .select('id, created_at, national_id, week_label, status, raw_plan, student_note')
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                pendingCountSpan.innerText = data.length;

                if (data.length === 0) {
                    container.innerHTML = `
                        <div style="background: rgba(16, 185, 129, 0.05); border: 1px dashed var(--success); padding: 50px; text-align: center; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                            <span style="font-size: 50px; display: block; margin-bottom: 15px;">✨</span>
                            <h3 style="color: var(--success); margin-bottom: 10px; font-size: 20px;">قرنطینه پاکسازی شده است!</h3>
                            <p style="color: var(--text-muted); font-size: 14px;">هیچ برنامه‌ی در انتظار تاییدی وجود ندارد. خسته نباشید فرمانده.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = ''; 

                for (let sch of data) {
                    const { data: stData } = await supabaseClient
                        .from('students')
                        .select('full_name, grade, major')
                        .eq('national_id', sch.national_id)
                        .single();

                    const studentName = stData ? stData.full_name : 'دانش‌آموز ناشناس';
                    const studentGrade = stData ? `${stData.grade} ${stData.major}` : 'پایه و رشته نامشخص';
                    const noteText = (sch.student_note && sch.student_note.trim() !== '') ? sch.student_note : 'دانش‌آموز یادداشتی ثبت نکرده است.';
                    
                    let planArr = typeof sch.raw_plan === 'string' ? JSON.parse(sch.raw_plan) : sch.raw_plan;
                    
                    let studyBlocks = [];
                    let totalTests = 0;
                    
                    if (planArr && Array.isArray(planArr)) {
                        studyBlocks = planArr.filter(b => b.type !== 'class' && b.type !== 'break' && b.type !== 'makeup' && b.day !== 'bench');
                        
                        studyBlocks.forEach(b => {
                            if (b.topic && b.topic.includes('(باکس تست‌زنی)')) {
                                totalTests += 30; 
                            } else {
                                totalTests += (parseInt(b.tests) || 0); 
                            }
                        });
                    }

                    const cardHTML = `
                        <div class="q-card" id="card-${sch.id}">
                            <div class="q-info">
                                <div class="s-header">
                                    <div>
                                        <div class="s-name">${studentName}</div>
                                        <div class="s-tags">
                                            <span class="s-tag">🎓 ${studentGrade}</span>
                                            <span class="s-tag">📅 آزمون ${sch.week_label ? sch.week_label.replace('آمادگی آزمون ', '') : ''}</span>
                                        </div>
                                    </div>
                                    <div style="font-size: 11px; color: var(--text-muted); font-family: monospace;">ID: ${sch.id.substring(0,8)}</div>
                                </div>
                                <div class="s-note">
                                    <span>💬 پیام ضمیمه شده:</span>
                                    "${noteText}"
                                </div>
                            </div>
                            
                            <div class="q-ai-status">
                                <div class="ai-label">آنالیز ساختار برنامه:</div>
                                <div class="ai-metric good"><span>پارت درسی خالص:</span> <span>📚 ${studyBlocks.length} پارت</span></div>
                                <div class="ai-metric"><span>مجموع تست هدف:</span> <span style="color: var(--text-main);">🎯 ${totalTests} تست</span></div>
                            </div>

                            <div class="q-actions">
                                <a href="surgery.html?schedule_id=${sch.id}" class="btn btn-surgery">مشاهده و جراحی 🔬</a>
                                <button class="btn btn-quick" onclick="quickApprove('${sch.id}')">تأیید سریع (ارسال) ✅</button>
                            </div>
                        </div>
                    `;
                    
                    container.insertAdjacentHTML('beforeend', cardHTML);
                }

            } catch (error) {
                console.error("Database Fetch Error:", error);
                container.innerHTML = '<div style="color: var(--danger); text-align: center; padding: 20px; border: 1px dashed var(--danger); border-radius: 12px; background: rgba(239, 68, 68, 0.05);">خطا در دریافت اطلاعات. لطفاً وضعیت اینترنت یا دیتابیس را بررسی کنید.</div>';
            }
        }

        // ==========================================
        // ✅ تابع تایید سریع
        // ==========================================
        async function quickApprove(scheduleId) {
            if(confirm("آیا مطمئن هستید که این برنامه بدون بررسی در اتاق جراحی، تایید شود؟")) {
                try {
                    const { error } = await supabaseClient
                        .from('ai_schedules')
                        .update({ status: 'approved' })
                        .eq('id', scheduleId);

                    if (error) throw error;

                    const card = document.getElementById(`card-${scheduleId}`);
                    card.style.opacity = '0';
                    card.style.transform = 'translateX(50px)';
                    
                    setTimeout(() => {
                        card.remove();
                        let countSpan = document.getElementById('pendingCount');
                        if(countSpan) countSpan.innerText = Math.max(0, parseInt(countSpan.innerText) - 1);
                        
                        if (document.querySelectorAll('.q-card').length === 0) {
                            loadQuarantineSchedules(); 
                        }
                    }, 300);

                } catch(err) {
                    alert("خطا در تایید برنامه: " + err.message);
                }
            }
        }
    </script>
</body>
</html>
