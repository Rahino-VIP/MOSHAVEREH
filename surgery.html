<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتاق جراحی تقویم | راهینو VIP</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { 
            --primary: #639889; --primary-hover: #4d7a6e; --primary-fade: rgba(99, 152, 137, 0.05);
            --accent: #d9858a; --accent-hover: #c4727c;
            --bg-color: #f7f9f8; --surface: #ffffff; --border-color: #e2e8f0;
            --text-main: #2d3748; --text-muted: #718096;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --purple: #8b5cf6;
            --time-col-width: 60px;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] { 
            --primary: #77bba9; --primary-hover: #8fd0bf; --primary-fade: rgba(119, 187, 169, 0.1);
            --accent: #e59ea3; --bg-color: #121918; --surface: #1b2624; --border-color: #2d3d3a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; 
            --shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; user-select: none; transition: background-color 0.3s, border-color 0.3s; }
        body { background: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .loader-overlay { position: fixed; inset: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; transition: 0.5s; }
        .spinner { font-size: 50px; animation: pulse 1s infinite alternate; margin-bottom: 15px; }
        @keyframes pulse { 0% { transform: scale(0.8); } 100% { transform: scale(1.1); } }
        #aiStatus { font-size: 13px; color: var(--warning); margin-top: 10px; height: 20px; font-weight: bold; }

        .mobile-header { display: none; }
        .sidebar-overlay { display: none; }

        .side-panel { width: 340px; background: var(--surface); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 20; box-shadow: -5px 0 20px rgba(0,0,0,0.05); transition: right 0.3s ease; }
        .panel-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--primary-fade); }
        .btn-back { background: var(--surface); border: 1px solid var(--border-color); color: var(--text-main); width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 18px; transition: 0.2s; box-shadow: var(--shadow); }
        .btn-back:hover { background: var(--danger); border-color: var(--danger); color: white; }
        
        .student-info { flex: 1; margin-right: 15px; }
        .student-info h2 { font-size: 16px; font-weight: 900; color: var(--primary); margin-bottom: 3px; }
        .student-info p { font-size: 11px; color: var(--text-muted); }

        .panel-body { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .ai-assistant { background: var(--primary-fade); border: 1px solid rgba(99, 152, 137, 0.2); padding: 15px; border-radius: 12px; position: relative; }
        .ai-assistant::before { content: '💬 یادداشت دانش‌آموز'; position: absolute; top: -10px; right: 15px; background: var(--surface); padding: 0 10px; font-size: 11px; color: var(--primary); font-weight: bold; border-radius: 4px; border: 1px solid var(--border-color); }
        .ai-text { font-size: 12px; color: var(--text-main); line-height: 1.6; }

        .bench-box { background: rgba(59, 130, 246, 0.05); border: 1px dashed var(--accent); padding: 15px; border-radius: 12px; margin-top: 5px; }
        .bench-title { font-size: 13px; font-weight: bold; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .bench-item { background: var(--surface); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; cursor: pointer; box-shadow: var(--shadow); }
        .bench-item:hover { border-color: var(--warning); transform: translateX(-5px); }
        .bench-info { flex: 1; }
        .bench-subj { font-size: 12px; font-weight: bold; color: var(--text-main); }
        .bench-topic { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

        .add-block-form { background: var(--surface); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; box-shadow: var(--shadow); }
        .form-title { font-size: 12px; font-weight: bold; margin-bottom: 10px; color: var(--text-main); display: flex; justify-content: space-between; }
        .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-css { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 10px; border-radius: 8px; font-size: 12px; outline: none; width: 100%; transition: 0.3s; }
        .input-css:focus { border-color: var(--primary); }
        .btn-add { background: var(--primary); border: none; color: white; width: 100%; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .btn-add:hover { background: var(--primary-hover); }

        .panel-footer { padding: 15px; border-top: 1px solid var(--border-color); background: var(--surface); }
        .btn-action { width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; font-family: 'Vazirmatn'; margin-bottom: 10px; }
        .btn-approve { background: linear-gradient(135deg, var(--success), #059669); color: white; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2); }
        .btn-approve:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }
        .btn-reject { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-reject:hover { background: rgba(239, 68, 68, 0.1); }

        .calendar-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); overflow: hidden; }
        .calendar-header { display: flex; background: var(--surface); border-bottom: 1px solid var(--border-color); z-index: 15; box-shadow: var(--shadow); }
        .time-spacer { width: var(--time-col-width); border-left: 1px solid var(--border-color); flex-shrink: 0; }
        .day-header { flex: 1; text-align: center; padding: 12px 0; font-size: 13px; font-weight: bold; border-left: 1px solid var(--border-color); color: var(--text-main); }
        .day-header.friday { border-left: none; color: var(--danger); }

        .calendar-body { flex: 1; overflow-y: auto; position: relative; display: flex; }
        .time-column { width: var(--time-col-width); background: var(--surface); border-left: 1px solid var(--border-color); z-index: 10; flex-shrink: 0; position: relative; }
        .time-label { height: 48px; display: flex; justify-content: center; padding-top: 5px; font-size: 11px; color: var(--text-muted); font-family: monospace; border-bottom: 1px solid transparent; }
        
        .days-grid { flex: 1; display: flex; position: relative; background-image: linear-gradient(var(--border-color) 1px, transparent 1px); background-size: 100% 48px; }
        .day-column { flex: 1; border-left: 1px solid var(--border-color); position: relative; min-height: 100%; }
        .day-column:last-child { border-left: none; }

        .event-block { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 6px 8px; font-size: 11px; cursor: grab; transition: box-shadow 0.2s, filter 0.2s; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); z-index: 5; color: var(--text-main); border: 1px solid var(--border-color); background: var(--surface); }
        .event-block:active { cursor: grabbing; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.2); filter: brightness(0.95); }
        [data-theme="dark"] .event-block:active { filter: brightness(1.1); }
        
        .event-time { font-size: 10px; color: var(--text-muted); font-family: monospace; margin-bottom: 2px; font-weight: bold; pointer-events: none; background: var(--bg-color); border: 1px solid var(--border-color); padding: 2px 5px; border-radius: 4px; display: inline-block; width: fit-content; }
        .event-title { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; font-size: 13px; margin-top: 2px; }
        .event-desc { font-size: 10px; opacity: 0.85; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; color: var(--text-muted); }
        
        .event-actions { position: absolute; top: 5px; left: 5px; display: none; gap: 4px; z-index: 10; }
        .event-block:hover .event-actions { display: flex; }
        .action-btn { background: var(--surface); border: 1px solid var(--border-color); border-radius: 4px; padding: 3px 6px; font-size: 10px; cursor: pointer; color: var(--text-main); transition: 0.2s; }
        .action-btn:hover { background: var(--bg-color); transform: scale(1.1); }

        .resizer { position: absolute; bottom: 0; left: 0; right: 0; height: 8px; cursor: ns-resize; background: rgba(0,0,0,0.05); transition: 0.2s; }
        [data-theme="dark"] .resizer { background: rgba(255,255,255,0.05); }
        .resizer:hover { background: var(--primary); opacity: 0.5; }

        .event-bio { background: rgba(16, 185, 129, 0.05); border-right: 4px solid #10b981; } 
        .event-math { background: rgba(245, 158, 11, 0.05); border-right: 4px solid #f59e0b; } 
        .event-chem { background: rgba(59, 130, 246, 0.05); border-right: 4px solid #3b82f6; } 
        .event-phys { background: rgba(139, 92, 246, 0.05); border-right: 4px solid #8b5cf6; } 
        .event-exam { background: rgba(239, 68, 68, 0.05); border-right: 4px solid #ef4444; } 
        .event-literature { background: rgba(236, 72, 153, 0.05); border-right: 4px solid #ec4899; } 
        .event-arabic { background: rgba(20, 184, 166, 0.05); border-right: 4px solid #14b8a6; } 
        .event-religion { background: rgba(16, 185, 129, 0.05); border-right: 4px solid #10b981; } 
        .event-english { background: rgba(99, 102, 241, 0.05); border-right: 4px solid #6366f1; } 
        .event-social { background: rgba(245, 158, 11, 0.05); border-right: 4px solid #f59e0b; } 
        .event-philosophy { background: rgba(139, 92, 246, 0.05); border-right: 4px solid #8b5cf6; } 
        .event-makeup { background: rgba(239, 68, 68, 0.05); border-right: 4px solid #ef4444; } 
        .event-break { background: var(--bg-color); color: var(--text-muted); border: 1px dashed var(--border-color); } 
        .event-default { background: var(--primary-fade); border-right: 4px solid var(--primary); } 

        @media (max-width: 992px) {
            body { flex-direction: column; overflow: hidden; }
            
            .mobile-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--border-color); z-index: 900; }
            .mobile-header .brand { margin: 0; font-size: 18px; font-weight: 900; color: var(--text-main); }
            .mobile-header .brand span { color: var(--primary); }
            .mobile-menu-btn { background: transparent; border: none; color: var(--primary); font-size: 26px; cursor: pointer; }
            
            .side-panel { position: fixed; right: -320px; top: 0; height: 100vh; width: 300px; box-shadow: none; transition: right 0.3s ease; z-index: 1000; }
            .side-panel.active { right: 0; box-shadow: -10px 0 30px rgba(0,0,0,0.8); }
            
            .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 999; }
            .sidebar-overlay.active { display: block; }

            .calendar-container { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; flex: 1; }
            .calendar-header { min-width: 800px; }
            .calendar-body { min-width: 800px; }
        }
    </style>
</head>
<body>

    <div class="loader-overlay" id="mainLoader">
        <div class="spinner">⚙️</div>
        <h3 id="loaderTitle" style="color: var(--primary);">آماده‌سازی اتاق جراحی...</h3>
        <div id="aiStatus"></div>
    </div>

    <div class="mobile-header">
        <div class="brand">قطب‌نمای <span>راهینو</span></div>
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="side-panel" id="sidePanel">
        <div class="panel-header">
            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="quarantine.html" class="btn-back">🔙</a>
                <button class="btn-back" onclick="toggleTheme()" id="themeBtn">☀️</button>
            </div>
            <div class="student-info" style="text-align: left;">
                <h2 id="stName">در حال دریافت...</h2>
                <p id="stMeta">...</p>
            </div>
        </div>

        <div class="panel-body">
            <div class="ai-assistant" style="background: rgba(59, 130, 246, 0.05); border-color: var(--accent); margin-bottom: 5px;">
                <div style="position: absolute; top: -10px; right: 15px; background: var(--surface); padding: 0 10px; font-size: 11px; color: var(--accent); font-weight: bold; border-radius: 4px; border: 1px solid var(--border-color);">📊 وضعیت و توان مطالعاتی</div>
                
                <div id="studentStatsContent" style="display: flex; flex-direction: column; gap: 10px; padding-top: 5px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                        <span style="color: var(--text-muted);">میانگین ساعت مطالعه:</span>
                        <strong style="color: var(--text-main); font-size: 15px;" id="uiAvgStudy">...</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                        <span style="color: var(--text-muted);">میانگین تعداد تست:</span>
                        <strong style="color: var(--text-main); font-size: 15px;" id="uiAvgTest">...</strong>
                    </div>
                    
                    <div style="border-top: 1px dashed var(--border-color); padding-top: 10px; margin-top: 5px;">
                        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">تنظیمات و سوئیچ‌های فعال این هفته:</div>
                        <div id="uiSwitches" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
                    </div>
                </div>
            </div>

            <div class="ai-assistant">
                <div class="ai-text" id="stNote">در حال پردازش...</div>
            </div>

            <div class="bench-box">
                <div class="bench-title">🟨 نیمکت ذخیره‌ها (باکس‌های جامانده)</div>
                <div id="benchContainer"></div>
            </div>

            <div class="add-block-form">
                <div class="form-title"><span>➕ افزودن پارت دستی</span></div>
                <div class="form-row">
                    <select id="newDay" class="input-css">
                        <option value="شنبه">شنبه</option><option value="یکشنبه">یکشنبه</option>
                        <option value="دوشنبه">دوشنبه</option><option value="سه‌شنبه">سه‌شنبه</option>
                        <option value="چهارشنبه">چهارشنبه</option><option value="پنجشنبه">پنجشنبه</option>
                        <option value="جمعه">جمعه</option>
                    </select>
                    <input type="time" id="newTime" class="input-css" value="16:00">
                </div>
                <div class="form-row">
                    <input type="text" id="newSubject" class="input-css" placeholder="نام درس (مثلاً زیست)">
                    <input type="number" id="newDuration" class="input-css" placeholder="زمان (دقیقه)" value="90">
                </div>
                <div class="form-row">
                    <input type="text" id="newTopic" class="input-css" placeholder="مبحث (مثلاً فصل ۱)">
                    <input type="number" id="newTests" class="input-css" placeholder="تعداد تست" value="0">
                </div>
                <button class="btn-add" onclick="addNewBlock()">تزریق پارت به تقویم</button>
            </div>
        </div>

        <div class="panel-footer">
            <textarea id="advisorNote" class="input-css" rows="2" style="margin-bottom: 10px; border-color: var(--success);" placeholder="نکته برای هوش مصنوعی (مثلاً: بگو این هفته رو فیزیک تمرکز کنه)"></textarea>
            
            <button class="btn-action btn-approve" id="btnApprove" onclick="saveAndApproveWithAI()">✅ تأیید و تولید پیام انگیزشی</button>
            <button class="btn-action btn-reject" id="btnReject" onclick="rejectSchedule()">❌ رد و حذف برنامه</button>
        </div>
    </div>
    
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="time-spacer"></div>
            <div class="day-header">شنبه</div><div class="day-header">یکشنبه</div>
            <div class="day-header">دوشنبه</div><div class="day-header">سه‌شنبه</div>
            <div class="day-header">چهارشنبه</div><div class="day-header">پنجشنبه</div>
            <div class="day-header friday">جمعه</div>
        </div>

        <div class="calendar-body" id="scrollArea">
            <div class="time-column" id="timeColumn"></div>
            <div class="days-grid" id="daysGrid">
                <div class="day-column" id="col-0" data-dayindex="0"></div>
                <div class="day-column" id="col-1" data-dayindex="1"></div>
                <div class="day-column" id="col-2" data-dayindex="2"></div>
                <div class="day-column" id="col-3" data-dayindex="3"></div>
                <div class="day-column" id="col-4" data-dayindex="4"></div>
                <div class="day-column" id="col-5" data-dayindex="5"></div>
                <div class="day-column" id="col-6" data-dayindex="6"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://etlutqwwqeahevsskjih.supabase.co'; 
        const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0bHV0cXd3cWVhaGV2c3NramloIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MTYxNjA2MiwiZXhwIjoyMDk3MTkyMDYyfQ.0tYN4CRA_D8jwColQ-qwcLqPXQUxwRlqC_9EcgcbZDI'; 
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY, {
            auth: {
                persistSession: false,
                autoRefreshToken: false,
                detectSessionInUrl: false
            }
        });
        
        let currentScheduleId = null;
        let scheduleDataArray = [];
        
        const PIXELS_PER_MIN = 0.8;
        const MIN_SNAP = 15; 
        const SNAP_PX = MIN_SNAP * PIXELS_PER_MIN; 

        const daysArr = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
        const dayMap = { 'شنبه': 0, 'یکشنبه': 1, 'دوشنبه': 2, 'سه‌شنبه': 3, 'چهارشنبه': 4, 'پنجشنبه': 5, 'جمعه': 6 };

        const themeBtn = document.getElementById('themeBtn');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        
        if (currentTheme === 'dark') { 
            document.documentElement.setAttribute('data-theme', 'dark'); 
            if(themeBtn) themeBtn.innerText = '☀️'; 
        } else {
            if(themeBtn) themeBtn.innerText = '🌙'; 
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) { 
                document.documentElement.removeAttribute('data-theme'); 
                localStorage.setItem('theme', 'light'); 
                if(themeBtn) themeBtn.innerText = '🌙'; 
            } else { 
                document.documentElement.setAttribute('data-theme', 'dark'); 
                localStorage.setItem('theme', 'dark'); 
                if(themeBtn) themeBtn.innerText = '☀️'; 
            }
        }

        function toggleSidebar() {
            document.getElementById('sidePanel').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        window.onload = async function() {
            const timeCol = document.getElementById('timeColumn');
            for(let i = 6; i <= 24; i++) {
                timeCol.innerHTML += `<div class="time-label">${i.toString().padStart(2, '0')}:00</div>`;
            }

            const urlParams = new URLSearchParams(window.location.search);
            currentScheduleId = urlParams.get('schedule_id');

            if (!currentScheduleId) {
                alert("خطا: هیچ برنامه‌ای انتخاب نشده است!");
                window.location.replace('quarantine.html');
                return;
            }
            await fetchAndRender();
        };

        async function fetchAndRender() {
            try {
                const { data: schData, error: schErr } = await supabaseClient
                    .from('ai_schedules').select('*').eq('id', currentScheduleId).maybeSingle();
                
                if (schErr) throw schErr;
                if (!schData) {
                    alert("خطا: برنامه‌ای با این شناسه در دیتابیس یافت نشد.");
                    window.location.replace('quarantine.html');
                    return;
                }

                const { data: stData } = await supabaseClient
                    .from('students').select('full_name, grade, major').eq('national_id', schData.national_id).maybeSingle();

                document.getElementById('stName').innerText = stData ? stData.full_name : 'ناشناس';
                document.getElementById('stMeta').innerText = stData ? `${stData.grade} ${stData.major}` : 'اطلاعات نامشخص';
                
                let note = schData.student_note && schData.student_note.trim() !== '' ? schData.student_note : 'دانش‌آموز یادداشتی ثبت نکرده است.';
                document.getElementById('stNote').innerText = note;

                let dashboardData = { switches: [], avgStudy: 0, avgTest: 0 };
                try {
                    if (schData.ai_consultant_report && schData.ai_consultant_report.startsWith('{')) {
                        dashboardData = JSON.parse(schData.ai_consultant_report);
                    }
                } catch(e) {
                    console.warn("خطا در پارس کردن اطلاعات داشبورد");
                }

                document.getElementById('uiAvgStudy').innerText = (dashboardData.avgStudy || 0) + ' ساعت در روز';
                document.getElementById('uiAvgTest').innerText = (dashboardData.avgTest || 0) + ' تست در روز';
                
                const switchesContainer = document.getElementById('uiSwitches');
                if (dashboardData.switches && dashboardData.switches.length > 0) {
                    switchesContainer.innerHTML = dashboardData.switches.map(sw => 
                        `<span style="background: rgba(16, 185, 129, 0.1); color: var(--success); padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; border: 1px solid var(--success);">${sw}</span>`
                    ).join('');
                } else {
                    switchesContainer.innerHTML = '<span style="font-size: 11px; color: var(--text-muted);">سوئیچ خاصی روشن نیست</span>';
                }
                
                scheduleDataArray = schData.raw_plan || [];
                renderAllBlocks();

                document.getElementById('mainLoader').style.opacity = '0';
                setTimeout(() => { document.getElementById('mainLoader').style.display = 'none'; }, 500);

                document.getElementById('scrollArea').scrollTop = 48;

            } catch (err) {
                alert("خطا در بارگذاری: " + err.message);
                window.location.replace('quarantine.html');
            }
        }

        function renderAllBlocks() {
            for(let i=0; i<=6; i++) document.getElementById(`col-${i}`).innerHTML = '';
            document.getElementById('benchContainer').innerHTML = '';

            let groupedBench = {};
            let benchCount = 0;

            scheduleDataArray.forEach((part, index) => {
                if (part.day === 'bench' || !part.day) {
                    if (!groupedBench[part.subject]) {
                        groupedBench[part.subject] = { count: 0, type: part.type || 'default', indices: [] };
                    }
                    groupedBench[part.subject].count++;
                    groupedBench[part.subject].indices.push(index); 
                    benchCount++;
                } else {
                    let colIndex = dayMap[part.day];
                    if (colIndex === undefined) return;

                    let startMins = timeStrToMins(part.start_time);
                    let endMins = timeStrToMins(part.end_time);
                    let topPx = Math.round((startMins - 360) * PIXELS_PER_MIN); 
                    let heightPx = Math.round((endMins - startMins) * PIXELS_PER_MIN);

                    let typeClass = "event-default";
                    if(part.type) typeClass = `event-${part.type}`;

                    const block = document.createElement('div');
                    block.className = `event-block ${typeClass}`;
                    block.style.top = `${topPx}px`;
                    block.style.height = `${heightPx}px`;
                    block.dataset.index = index; 

                    block.innerHTML = `
                        <div class="event-actions">
                            ${part.type !== 'break' && part.type !== 'class' ? `<div class="action-btn" title="انتقال به نیمکت" onclick="moveToBench(${index}, event)">🔽</div>` : ''}
                            <div class="action-btn" title="حذف" onclick="deleteBlock(${index}, event)">🗑️</div>
                            <div class="action-btn" title="کپی" onclick="cloneBlock(${index}, event)">📋</div>
                        </div>
                        <div class="event-time">${part.start_time} - ${part.end_time}</div>
                        <div class="event-title">${part.subject}</div>
                        <div class="event-desc">${part.topic || ''}</div>
                        <div class="resizer"></div>
                    `;

                    block.addEventListener('mousedown', handleMouseDown);
                    document.getElementById(`col-${colIndex}`).appendChild(block);
                }
            });

            if(benchCount === 0) {
                document.getElementById('benchContainer').innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center;">نیمکت خالی است.</div>';
            } else {
                for (let subject in groupedBench) {
                    let group = groupedBench[subject];
                    let firstIndex = group.indices[0]; 

                    let benchHtml = `
                        <div class="bench-item event-${group.type}" style="border-right: 4px solid var(--primary); padding: 10px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                            <div class="bench-info">
                                <div class="bench-subj" style="font-weight: bold; font-size: 14px; margin-bottom: 4px;">${subject}</div>
                                <div class="bench-topic" style="font-size: 12px;">📚 ${group.count} باکس تو صف موندن</div>
                            </div>
                            <div class="bench-actions" style="display: flex; gap: 5px; flex-direction: column;">
                                <div class="action-btn" style="cursor: pointer; background: var(--surface); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; font-size: 11px; text-align: center;" onclick="injectFromBench(${firstIndex})">➕ تقویم</div>
                                <div class="action-btn" style="cursor: pointer; color: var(--danger); background: var(--surface); border: 1px solid rgba(239, 68, 68, 0.3); padding: 4px 8px; border-radius: 4px; font-size: 11px; text-align: center;" onclick="deleteGroupFromBench('${subject}')">🗑️ حذف کل درس</div>
                            </div>
                        </div>
                    `;
                    document.getElementById('benchContainer').innerHTML += benchHtml;
                }
            }
        }
        
        function injectFromBench(index) {
            scheduleDataArray[index].day = 'شنبه'; 
            scheduleDataArray[index].start_time = '16:00';
            
            let duration = scheduleDataArray[index].duration || 90;
            let endMins = timeStrToMins('16:00') + duration;
            scheduleDataArray[index].end_time = minsToTimeStr(endMins);
            
            renderAllBlocks(); 
        }

        let isDragging = false; let isResizing = false;
        let activeBlock = null; let activeIndex = -1;
        let startY = 0; let initialTop = 0; let initialHeight = 0;

        function handleMouseDown(e) {
            if (e.button !== 0) return; 
            if (e.target.classList.contains('action-btn')) return; 

            activeBlock = e.currentTarget;
            activeIndex = parseInt(activeBlock.dataset.index);
            startY = e.clientY;
            initialTop = parseFloat(activeBlock.style.top) || 0;
            initialHeight = parseFloat(activeBlock.style.height) || 0;

            if (e.target.classList.contains('resizer')) isResizing = true;
            else isDragging = true;

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function handleMouseMove(e) {
            if (!activeBlock) return;
            let dy = e.clientY - startY;

            if (isResizing) {
                let newHeight = initialHeight + dy;
                newHeight = Math.round(newHeight / SNAP_PX) * SNAP_PX; 
                if (newHeight < SNAP_PX) newHeight = SNAP_PX;
                activeBlock.style.height = `${newHeight}px`;
                updateBlockTimeVisual(activeBlock, initialTop, newHeight);
            } 
            else if (isDragging) {
                let newTop = initialTop + dy;
                newTop = Math.round(newTop / SNAP_PX) * SNAP_PX;
                if (newTop < 0) newTop = 0;
                activeBlock.style.top = `${newTop}px`;
                updateBlockTimeVisual(activeBlock, newTop, initialHeight);

                const gridRect = document.getElementById('daysGrid').getBoundingClientRect();
                const colWidth = gridRect.width / 7;
                let mouseXRTL = gridRect.right - e.clientX; 
                
                if (mouseXRTL >= 0 && mouseXRTL <= gridRect.width) {
                    let hoveredColIndex = Math.floor(mouseXRTL / colWidth);
                    const currentParentId = activeBlock.parentElement.id;
                    if (currentParentId !== `col-${hoveredColIndex}`) {
                        document.getElementById(`col-${hoveredColIndex}`).appendChild(activeBlock);
                    }
                }
            }
        }

        function handleMouseUp(e) {
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);

            if (activeBlock && activeIndex !== -1) {
                let finalTop = parseFloat(activeBlock.style.top);
                let finalHeight = parseFloat(activeBlock.style.height);
                let finalColIndex = parseInt(activeBlock.parentElement.dataset.dayindex);

                let startMins = Math.round(finalTop / PIXELS_PER_MIN) + 360;
                let endMins = startMins + Math.round(finalHeight / PIXELS_PER_MIN);

                scheduleDataArray[activeIndex].day = daysArr[finalColIndex];
                scheduleDataArray[activeIndex].start_time = minsToTimeStr(startMins);
                scheduleDataArray[activeIndex].end_time = minsToTimeStr(endMins);

                activeBlock = null; isDragging = false; isResizing = false;
            }
        }

        function updateBlockTimeVisual(block, topPx, heightPx) {
            let sMins = Math.round(topPx / PIXELS_PER_MIN) + 360;
            let eMins = sMins + Math.round(heightPx / PIXELS_PER_MIN);
            block.querySelector('.event-time').innerText = `${minsToTimeStr(sMins)} - ${minsToTimeStr(eMins)}`;
        }

        function deleteBlock(index, e) {
            e.stopPropagation();
            let origBlock = scheduleDataArray[index];
            let isMakeup = (origBlock.type === 'makeup' || origBlock.subject.includes('جبرانی'));
            let confirmMsg = isMakeup 
                ? "آیا از حذف این باکس جبرانی مطمئن هستید؟ (جای آن روی تقویم خالی می‌ماند)" 
                : "پارت حذف شود؟ (جای آن با بانک جبرانی پر خواهد شد)";

            if(confirm(confirmMsg)) {
                if (isMakeup) {
                    scheduleDataArray.splice(index, 1);
                } else {
                    let makeupBlock = {
                        day: origBlock.day,
                        type: 'makeup',
                        subject: 'بانک جبرانی',
                        topic: 'جایگزینی دروس جا مانده',
                        start_time: origBlock.start_time,
                        end_time: origBlock.end_time,
                        duration: origBlock.duration || 90,
                        status: 'pending',
                        block_id: 'blk_mkp_' + Math.random().toString(36).substr(2, 6)
                    };
                    scheduleDataArray.splice(index, 1, makeupBlock);
                }
                renderAllBlocks(); 
            }
        }

        function moveToBench(index, e) {
            e.stopPropagation(); 
            let origBlock = scheduleDataArray[index];
            
            if (origBlock.type === 'makeup' || origBlock.subject.includes('جبرانی')) {
                alert("⚠️ باکس جبرانی رو که نمی‌تونی بفرستی رو نیمکت! اگر بهش نیاز نداری، از دکمه «حذف» استفاده کن.");
                return; 
            }

            if(confirm("این پارت به نیمکت منتقل شود؟ (جای آن با بانک جبرانی پر خواهد شد)")) {
                let makeupBlock = {
                    day: origBlock.day,
                    type: 'makeup',
                    subject: 'بانک جبرانی',
                    topic: 'جایگزینی دروس جا مانده',
                    start_time: origBlock.start_time,
                    end_time: origBlock.end_time,
                    duration: origBlock.duration || 90,
                    status: 'pending',
                    block_id: 'blk_mkp_' + Math.random().toString(36).substr(2, 6)
                };

                scheduleDataArray[index].day = 'bench';
                scheduleDataArray[index].start_time = '';
                scheduleDataArray[index].end_time = '';
                scheduleDataArray[index].is_benched = true;

                scheduleDataArray.push(makeupBlock);
                renderAllBlocks(); 
            }
        }

        function deleteGroupFromBench(subjectName) {
            if(confirm(`مطمئنی می‌خوای کل باکس‌های "${subjectName}" رو از نیمکت حذف کنی؟`)) {
                scheduleDataArray = scheduleDataArray.filter(part => !(part.day === 'bench' && part.subject === subjectName));
                renderAllBlocks();
            }
        }

        function cloneBlock(index, e) {
            e.stopPropagation();
            let original = scheduleDataArray[index];
            let duration = timeStrToMins(original.end_time) - timeStrToMins(original.start_time);
            let newStartMins = timeStrToMins(original.start_time) + MIN_SNAP; 
            
            let clone = JSON.parse(JSON.stringify(original)); 
            clone.start_time = minsToTimeStr(newStartMins);
            clone.end_time = minsToTimeStr(newStartMins + duration);
            
            scheduleDataArray.push(clone);
            renderAllBlocks();
        }

        function addNewBlock() {
            let day = document.getElementById('newDay').value;
            let timeStr = document.getElementById('newTime').value;
            let subject = document.getElementById('newSubject').value;
            let duration = parseInt(document.getElementById('newDuration').value);
            let topic = document.getElementById('newTopic').value;

            if(!subject) { alert("نام درس را وارد کنید!"); return; }

            let startMins = timeStrToMins(timeStr);
            let endMins = startMins + duration;

            let typeClass = "default";
            if(subject.includes("زیست")) typeClass = "bio";
            else if(subject.includes("ریاضی")) typeClass = "math";
            else if(subject.includes("شیمی")) typeClass = "chem";
            else if(subject.includes("فیزیک")) typeClass = "phys";
            else if(subject.includes("آزمون")) typeClass = "exam";

            scheduleDataArray.push({
                day: day, start_time: minsToTimeStr(startMins), end_time: minsToTimeStr(endMins),
                subject: subject, topic: topic, type: typeClass, duration: duration
            });

            document.getElementById('newSubject').value = "";
            document.getElementById('newTopic').value = "";
            renderAllBlocks();
        }

        const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyUy08rtBxcRePHokg_FT0s_8e6Qj5Y1CcQXE5F_H0oX5VTvO7VhCs_KTfRp6xlKtynbA/exec';

        async function saveAndApproveWithAI() {
            const btn = document.getElementById('btnApprove');
            const advNote = document.getElementById('advisorNote').value;
            const studentName = document.getElementById('stName').innerText;
            
            btn.innerHTML = 'در حال ساخت پیام انگیزشی... ⏳';
            btn.disabled = true;

            try {
                const aiResponse = await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'generate_motivation', 
                        student_name: studentName,
                        advisor_note: advNote
                    })
                });
                
                const aiResult = await aiResponse.json();
                let generatedMotivations = {};
                
                if (aiResult.success) {
                    generatedMotivations = aiResult.motivation;
                } else {
                    console.warn("خطا در تولید انگیزه:", aiResult.error);
                    generatedMotivations = { weekly_motivation: "با قدرت پیش برو!", daily_motivations: {} };
                }

                btn.innerHTML = 'در حال ذخیره نهایی... 💾';

                const { error } = await supabaseClient
                    .from('ai_schedules')
                    .update({ 
                        raw_plan: scheduleDataArray,
                        ai_motivations: generatedMotivations, 
                        status: 'approved' 
                    })
                    .eq('id', currentScheduleId);

                if (error) throw error;
                
                alert("برنامه نهایی تایید و پیام‌های انگیزشی تولید شد! 🚀");
                window.location.replace('quarantine.html');

            } catch (err) {
                console.error(err);
                alert("❌ خطا در ثبت اطلاعات:\n" + err.message);
                btn.innerHTML = '✅ تأیید و تولید پیام انگیزشی';
                btn.disabled = false;
            }
        }
        function rejectSchedule() {
            if(confirm("آیا مطمئن هستید که این برنامه کاملاً پاک شود؟")) {
                const btn = document.getElementById('btnReject');
                btn.innerHTML = 'در حال حذف... ⏳';
                btn.disabled = true;
                supabaseClient.from('ai_schedules').delete().eq('id', currentScheduleId)
                .then(({error}) => {
                    if (error) throw error;
                    window.location.replace('quarantine.html');
                }).catch(err => {
                    alert("خطا در حذف: " + err.message);
                    btn.innerHTML = '❌ رد و حذف برنامه';
                    btn.disabled = false;
                });
            }
        }

        function timeStrToMins(timeStr) {
            if(!timeStr) return 0;
            let parts = timeStr.split(':');
            return (parseInt(parts[0]) * 60) + parseInt(parts[1]);
        }
        function minsToTimeStr(mins) {
            let h = Math.floor(mins / 60);
            let m = Math.floor(mins % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }
    </script>
</body>
