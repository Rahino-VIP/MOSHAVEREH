<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتال پانسیون راهینو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        :root { 
            --primary: #639889; --primary-hover: #4d7a6e; --primary-fade: rgba(99, 152, 137, 0.15);
            --accent: #d9858a; --accent-hover: #c4727c; --accent-fade: rgba(217, 133, 138, 0.15);
            --bg-color: #f1f5f3; --surface: #ffffff; --surface-glass: rgba(255, 255, 255, 0.85);
            --text-main: #2d3748; --text-muted: #718096; --border: #e2e8f0; 
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --shadow: 0 10px 30px rgba(0,0,0,0.05); 
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="dark"] {
            --primary: #77bba9; --primary-hover: #8fd0bf; --primary-fade: rgba(119, 187, 169, 0.15);
            --accent: #e59ea3; --accent-hover: #f0b2b6; --accent-fade: rgba(229, 158, 163, 0.15);
            --bg-color: #0a0f0d; --surface: #121a18; --surface-glass: rgba(18, 26, 24, 0.85);
            --text-main: #f1f5f9; --text-muted: #8b9d99; --border: #263633; 
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100dvh; margin: 0; padding: 20px; }

        .app-container { width: 100%; max-width: 480px; position: relative; display: flex; flex-direction: column; overflow: hidden; background: transparent; }
        .glow-bg { position: absolute; width: 300px; height: 300px; background: var(--primary-fade); filter: blur(100px); border-radius: 50%; z-index: 0; top: 10%; left: 50%; transform: translateX(-50%); pointer-events: none;}

        .auth-container { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; width: 100%; overflow: hidden; box-shadow: var(--shadow); position: relative; z-index: 1;}
        .header-box { text-align: center; padding: 35px 25px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, var(--primary-fade), transparent); }
        
        .header-logo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid var(--primary); padding: 3px; background: var(--surface); }
        
        .header-box h1 { font-size: 22px; color: var(--primary); font-weight: 900; margin-bottom: 8px; }
        .header-box p { font-size: 13px; color: var(--text-muted); font-weight: bold; }
        
        .step-section { padding: 30px; display: none; animation: fadeIn 0.4s ease-out; }
        .step-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-input { width: 100%; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 16px; border-radius: 16px; font-size: 15px; outline: none; transition: var(--transition); font-weight: bold; margin-bottom: 15px; text-align: center;}
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-fade); }
        select.form-input { appearance: none; cursor: pointer; }
        
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 900; font-size: 15px; cursor: pointer; transition: var(--transition); color: white; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); box-shadow: 0 10px 20px var(--primary-fade); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); margin-top: 15px;}
        .text-link { color: var(--accent); font-size: 13px; text-align: center; display: block; margin-top: 20px; cursor: pointer; font-weight: bold; }
        .alert-box { background: var(--accent-fade); border: 1px solid rgba(217, 133, 138, 0.3); color: var(--accent); padding: 15px; border-radius: 14px; font-size: 13px; text-align: center; margin-bottom: 25px; font-weight: bold; display: none; }
        
        .promo-hint { font-size: 11px; color: var(--text-muted); margin-top: -5px; margin-bottom: 15px; line-height: 1.6; font-weight: bold; padding: 0 5px; text-align: center; }
        .promo-hint span { color: var(--accent); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="glow-bg"></div>
        
        <div class="auth-container">
            <div class="header-box">
                <img src="YOUR_LOGO_URL_HERE" alt="لوگو پانسیون" class="header-logo" id="pansionLogo">
                <h1 id="headerTitle">ورود به پانسیون</h1>
                <p id="headerSub">موبایل خود را برای ورود یا ثبت‌نام وارد کنید</p>
            </div>
            
            <div class="step-section active" id="step-phone">
                <input type="tel" id="inpPhone" class="form-input" placeholder="09123456789" maxlength="11" style="font-size: 22px; letter-spacing: 3px;" autocomplete="off">
                <button class="btn btn-primary" onclick="goToStep('step-register', 'ثبت‌نام در پانسیون', 'تشکیل پرونده جدید')">بررسی و ادامه 🚀</button>
                <button class="btn btn-outline" onclick="goToStep('step-login', 'ورود به پنل', 'رمز عبور خود را وارد کنید')">شبیه‌سازی ورود</button>
            </div>

            <div class="step-section" id="step-login">
                <input type="password" id="inpLoginPass" class="form-input" placeholder="••••••••" style="letter-spacing: 3px;" autocomplete="off">
                <button class="btn btn-primary">ورود به پنل 🏠</button>
                <a class="text-link" onclick="goToStep('step-recovery', 'بازیابی رمز', 'پاسخ سوال امنیتی را وارد کنید')">رمز عبورم را فراموش کرده‌ام!</a>
                <button class="btn btn-outline" onclick="goToStep('step-phone', 'ورود به پانسیون', 'موبایل خود را وارد کنید')">تغییر شماره</button>
            </div>

            <div class="step-section" id="step-register">
                <div class="alert-box" style="display: block;">شماره شما یافت نشد. لطفاً اطلاعات را تکمیل کنید.</div>
                
                <input type="text" id="regName" class="form-input" placeholder="نام و نام خانوادگی کامل">
                
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <select id="regGrade" class="form-input" style="margin-bottom: 0;">
                        <option value="" disabled selected>پایه تحصیلی</option>
                        <option value="دهم">دهم</option>
                        <option value="یازدهم">یازدهم</option>
                        <option value="دوازدهم">دوازدهم</option>
                        <option value="پشت کنکوری">پشت کنکوری</option>
                        <option value="دانشجو">دانشجو</option>
                    </select>
                    <input type="text" id="regMajor" class="form-input" placeholder="رشته تحصیلی" style="margin-bottom: 0;">
                </div>
                
                <input type="text" id="regSchool" class="form-input" placeholder="مدرسه / دانشگاه">
                
                <input type="text" id="regReferral" class="form-input" placeholder="کد معرف دوستان (اختیاری)" style="text-transform: uppercase;">
                <div class="promo-hint">با وارد کردن کد معرف، <span>۲۰ هزار تومان</span> در رزرو روزانه و <span>۱۰۰ هزار تومان</span> در اشتراک ماهانه تخفیف بگیرید.</div>
                
                <input type="password" id="regPass" class="form-input" placeholder="رمز عبور پنل (حداقل ۴ رقم)">
                
                <select id="regSecQ" class="form-input">
                    <option value="" disabled selected>سوال امنیتی برای فراموشی رمز</option>
                    <option value="نام بهترین دوست دوران کودکی شما چیست؟">نام بهترین دوست دوران کودکی شما چیست؟</option>
                    <option value="نام اولین مدرسه‌ای که رفتید چه بود؟">نام اولین مدرسه‌ای که رفتید چه بود؟</option>
                    <option value="رنگ مورد علاقه شما در کودکی چه بود؟">رنگ مورد علاقه شما در کودکی چه بود؟</option>
                </select>
                <input type="text" id="regSecA" class="form-input" placeholder="پاسخ سوال امنیتی">
                
                <button class="btn btn-primary">ثبت‌نام و ورود 🎉</button>
                <button class="btn btn-outline" onclick="goToStep('step-phone', 'ورود به پانسیون', 'موبایل خود را وارد کنید')">انصراف</button>
            </div>

            <div class="step-section" id="step-recovery">
                <div id="recoveryQuestionText" style="font-weight: bold; margin-bottom: 10px; font-size: 14px; color: var(--primary); text-align: center;">سوال امنیتی شما در اینجا نمایش داده می‌شود</div>
                <input type="text" id="inpRecoveryAns" class="form-input" placeholder="پاسخ خود را وارد کنید">
                <input type="password" id="inpRecoveryNewPass" class="form-input" placeholder="رمز عبور جدید (حداقل ۴ رقم)">
                <button class="btn btn-primary">تغییر رمز و ورود 🔄</button>
                <button class="btn btn-outline" onclick="goToStep('step-login', 'ورود به پنل', 'رمز عبور خود را وارد کنید')">بازگشت</button>
            </div>

        </div>
    </div>

    <script>
        function goToStep(stepId, title, sub) {
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
            document.getElementById('headerTitle').innerText = title;
            document.getElementById('headerSub').innerText = sub;
        }
    </script>
</body>
</html>
